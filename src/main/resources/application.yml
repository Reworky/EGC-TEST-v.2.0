server:
  port: ${SERVER_PORT:8090}

spring:
  jackson:
    time-zone: GMT+7
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:${DB_PATH:/data/game-platform-bot};AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  club-name: ${APP_CLUB_NAME:EXPERIENCE GAMING CLUB}
  support-username: ${APP_SUPPORT_USERNAME:support_manager}
  admin-ids: ${APP_ADMIN_IDS:${INITIAL_ADMIN_ID:}}
  moderator-ids: ${APP_MODERATOR_IDS:}
  admin-ids-raw: ${APP_ADMIN_IDS:}
  moderator-ids-raw: ${APP_MODERATOR_IDS:}
  initial-admin-id: ${INITIAL_ADMIN_ID:}
  required-channel-id: ${REQUIRED_CHANNEL_ID:}
  required-channel-username: ${REQUIRED_CHANNEL_USERNAME:@exgamingclub}
  required-channel-url: ${REQUIRED_CHANNEL_URL:}
  required-channel-title: ${REQUIRED_CHANNEL_TITLE:EXPERIENCE GAMING CLUB}
  bot-token: ${TELEGRAM_BOT_TOKEN:${BOT_TOKEN:}}
  bot-username: ${TELEGRAM_BOT_USERNAME:${BOT_USERNAME:}}
  jwt-secret: ${JWT_SECRET:change-me-in-production-must-be-32-chars}
  jwt-expiration-days: ${JWT_EXPIRATION_DAYS:30}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  actionpay-postback-token: ${ACTIONPAY_POSTBACK_TOKEN:}
  admitad-postback-token: ${ADMITAD_POSTBACK_TOKEN:}
  mobidea-postback-token: ${MOBIDEA_POSTBACK_TOKEN:}
  adsgram-reward-token: ${ADSGRAM_REWARD_TOKEN:}
  telega-reward-token: ${TELEGA_REWARD_TOKEN:}
  adsgram-api-token: ${ADSGRAM_API_TOKEN:}
  adsgram-bot-block-id: ${ADSGRAM_BOT_BLOCK_ID:}
  # Рекламу в боте (блок bot-46455) включает только ADSGRAM_BOT_ADS_ENABLED=true: выключена до решения вопроса с рекламой азартных игр (2026-09-26)
  adsgram-bot-ads-enabled: ${ADSGRAM_BOT_ADS_ENABLED:false}
  payout-channel-username: ${PAYOUT_CHANNEL_USERNAME:@egc_payouts}
  # Кейсы CS2 в магазине наград: каталог виден всем; обмен включается только при true (пока false - кнопка «Обмен скоро откроется»)
  cs2-cases-enabled: ${CS2_CASES_ENABLED:false}
  # EGC VPN: выключен, пока VPN_ENABLED не true. Панель 3x-ui (inbound hysteria), клиенты создаются через её API; адрес, логин и пароль только из окружения
  vpn-enabled: ${VPN_ENABLED:false}
  vpn-xui-url: ${VPN_XUI_URL:}
  vpn-xui-user: ${VPN_XUI_USER:}
  vpn-xui-pass: ${VPN_XUI_PASS:}
  vpn-xui-inbound-id: ${VPN_XUI_INBOUND_ID:9}
  vpn-sub-base: ${VPN_SUB_BASE:}
  vpn-trial-days: ${VPN_TRIAL_DAYS:3}
  vpn-trial-gb: ${VPN_TRIAL_GB:5}
  vpn-paid-days: ${VPN_PAID_DAYS:30}
  vpn-paid-gb: ${VPN_PAID_GB:0}
  vpn-client-app: ${VPN_CLIENT_APP:hiddify}
  # Отдельный бот EGC VPN (вторая панель, не пилот): выключен, пока VPN2_ENABLED не true; без VPN2_BOT_TOKEN бот не регистрируется.
  # Закрыт для всех, кроме админов и VPN2_TEST_IDS (через запятую), пока VPN2_OPEN не true
  vpn2-enabled: ${VPN2_ENABLED:false}
  vpn2-open: ${VPN2_OPEN:false}
  vpn2-test-ids: ${VPN2_TEST_IDS:}
  vpn2-bot-token: ${VPN2_BOT_TOKEN:}
  vpn2-bot-username: ${VPN2_BOT_USERNAME:}
  vpn2-xui-url: ${VPN2_XUI_URL:}
  vpn2-xui-user: ${VPN2_XUI_USER:}
  vpn2-xui-pass: ${VPN2_XUI_PASS:}
  vpn2-xui-inbound-id: ${VPN2_XUI_INBOUND_ID:2}
  vpn2-sub-base: ${VPN2_SUB_BASE:}
  vpn2-trial-days: ${VPN2_TRIAL_DAYS:3}
  vpn2-trial-gb: ${VPN2_TRIAL_GB:5}
  vpn2-reviews-channel: ${VPN2_REVIEWS_CHANNEL:}
  # Секрет скрипта проверки на сервере входа (heartbeat и копии базы панели); без него приём сигналов выключен, алертов о пропаже сигнала нет
  vpn2-health-secret: ${VPN2_HEALTH_SECRET:}
  vpn2-backup-dir: ${VPN2_BACKUP_DIR:/data/vpn2-panel-backups}
  # Способы оплаты кроме Stars: EXC целиком (кнопки видны всегда, работают при true), перевод рублями по реквизитам (способ открыт, когда текст задан), CryptoBot (открыт, когда задан токен Crypto Pay)
  vpn2-exc-pay-enabled: ${VPN2_EXC_PAY_ENABLED:false}
  vpn2-card-details: ${VPN2_CARD_DETAILS:}
  vpn2-cryptobot-token: ${VPN2_CRYPTOBOT_TOKEN:}
  vpn2-cryptobot-url: ${VPN2_CRYPTOBOT_URL:https://pay.crypt.bot/api}

claude:
  api-key: ${CLAUDE_API_KEY:}
  confidence-threshold: 0.85

brawlstars:
  api-token: ${BRAWL_STARS_API_TOKEN:}

clashofclans:
  api-token: ${CLASH_OF_CLANS_API_TOKEN:}

clashroyale:
  api-token: ${CLASH_ROYALE_API_TOKEN:}

steam:
  api-key: ${STEAM_API_KEY:}

pubg:
  api-key: ${PUBG_API_KEY:}

achievement:
  exc-milestones: ${ACHIEVEMENT_EXC_MILESTONES:10000,50000,100000,500000,1000000}
